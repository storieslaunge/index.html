  function isUpcomingBooking(booking) {
    const today = new Date().toLocaleDateString('sv-SE');

  function updateDeliveryMapLink() {
    const latitudeValue = document.querySelector('[name="latitude"]')?.value.trim();
    const longitudeValue = document.querySelector('[name="longitude"]')?.value.trim();
    const link = document.querySelector('#delivery-map-link');
    if (!link) return;
    const status = document.querySelector('#location-status');
    if (!latitudeValue || !longitudeValue) {
      link.hidden = true;
      if (status) status.textContent = t('Введите координаты или определите точку по GPS.');
      return;
    }
    const latitude = Number(latitudeValue);
    const longitude = Number(longitudeValue);
    if (!Number.isFinite(latitude) || Math.abs(latitude) > 90 || !Number.isFinite(longitude) || Math.abs(longitude) > 180) {
      link.hidden = true;
      if (status) status.textContent = t('Проверьте координаты доставки.');
      return;
    }
    link.href = `https://www.openstreetmap.org/?mlat=${latitude}&mlon=${longitude}#map=17/${latitude}/${longitude}`;
    link.hidden = false;
    if (status) status.textContent = t('Координаты точки доставки указаны.');
  }

    const table = event.target.closest('[data-table]');
    const remove = event.target.closest('[data-remove]');
    const orderType = event.target.closest('[data-order-type]');
    const geolocate = event.target.closest('[data-geolocate]');
    const homeSlide = event.target.closest('[data-home-slide]');
    const action = event.target.closest('[data-action]');
    try {
      if (homeSlide) { showHomeSlide(Number(homeSlide.dataset.homeSlide)); return; }
      if (geolocate) {
        const status = document.querySelector('#location-status');
        if (!navigator.geolocation) { if (status) status.textContent = t('Геолокация недоступна в этом браузере.'); return; }
        geolocate.disabled = true;
        if (status) status.textContent = t('Определяем местоположение…');
        navigator.geolocation.getCurrentPosition(position => {
          state.deliveryDetails.latitude = position.coords.latitude.toFixed(6);
          state.deliveryDetails.longitude = position.coords.longitude.toFixed(6);
          document.querySelector('[name="latitude"]').value = state.deliveryDetails.latitude;
          document.querySelector('[name="longitude"]').value = state.deliveryDetails.longitude;
          geolocate.disabled = false;
          updateDeliveryMapLink();
        }, () => {
          geolocate.disabled = false;
          if (status) status.textContent = t('Не удалось определить точку. Введите координаты вручную.');
        }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
        return;
      }
      if (add) { state.cart[add.dataset.add] = (state.cart[add.dataset.add] || 0) + 1; render(); return; }
      if (quantity) { const id = quantity.dataset.quantity; state.cart[id] = Math.max(0, (state.cart[id] || 0) + Number(quantity.dataset.delta)); render(); return; }
      if (product && !event.target.closest('button')) { state.selectedProduct = Number(product.dataset.product); state.detailQuantity = 1; render(); return; }
      if (remove) { state.cart[remove.dataset.remove] = 0; render(); }
      if (go) { state.section = go.dataset.go; render(); }
      if (category) { state.category = category.dataset.category; render(); }
      if (table) {
        state.selectedTable = Number(table.dataset.table);
        document.querySelector('#selected-table').value = state.selectedTable;
        document.querySelectorAll('[data-table]').forEach(button => {
          const selected = Number(button.dataset.table) === state.selectedTable;
          button.classList.toggle('selected', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
      }
      if (orderType) {
        if (orderType.disabled) return;
        state.orderType = orderType.dataset.orderType;
        const select = document.querySelector('#delivery-type');
        select.value = orderType.dataset.orderType;
        document.querySelectorAll('[data-order-type]').forEach(button => button.classList.toggle('active', button === orderType));
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }
      if (action?.dataset.action === 'route') {
        const url = 'https://maps.google.com/?q=Stories+Lounge+Bar';
        if (tg?.openLink) tg.openLink(url); else window.open(url, '_blank', 'noopener');
      }
      if (adminTab) { state.adminTab = adminTab.dataset.adminTab; render(); }
      if (bookingStatus) { await api(`/api/admin/bookings/${bookingStatus.dataset.id}`, {method:'PATCH', body:JSON.stringify({status:bookingStatus.dataset.bookingStatus})}); toast('Статус брони обновлён'); await loadAdmin(); }
      if (deleteItem) { await api(`/api/admin/menu/${deleteItem.dataset.deleteMenu}`, {method:'DELETE'}); await loadData(); toast('Позиция удалена'); render(); }
    } catch (error) { toast(error.message, true); }
  });
  overlayRoot.addEventListener('click', event => {
    const closeProduct = event.target.closest('[data-close-product]');
    const detailQuantity = event.target.closest('[data-detail-quantity]');
    const detailAdd = event.target.closest('[data-detail-add]');
    if (closeProduct) {
      if (event.target === closeProduct || closeProduct.matches('button')) { state.selectedProduct = null; render(); }
      return;
    }
    if (detailQuantity) { state.detailQuantity = Math.max(1, state.detailQuantity + Number(detailQuantity.dataset.detailQuantity)); render(); return; }
    if (detailAdd) { const id = detailAdd.dataset.detailAdd; state.cart[id] = (state.cart[id] || 0) + state.detailQuantity; state.selectedProduct = null; state.detailQuantity = 1; render(); }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && state.selectedProduct !== null) { state.selectedProduct = null; render(); return; }
    if (!app.contains(event.target)) return;
    const product = event.target.closest('[data-product]');
    if (product && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); state.selectedProduct = Number(product.dataset.product); state.detailQuantity = 1; render(); }
  });
  app.addEventListener('input', event => {
    if (Object.hasOwn(state.deliveryDetails, event.target.name)) state.deliveryDetails[event.target.name] = event.target.value;
    if (event.target.name === 'latitude' || event.target.name === 'longitude') updateDeliveryMapLink();
  });
  app.addEventListener('change', event => {
    if (event.target.id === 'delivery-type') {
      const delivery = event.target.value === 'delivery';
      document.querySelector('#address-field').hidden = !delivery;
      document.querySelector('#phone-field').hidden = !delivery;
      document.querySelector('#delivery-location').hidden = !delivery;
      document.querySelector('#booking-field').hidden = delivery;
      document.querySelector('[name="address"]').required = delivery;
      document.querySelector('[name="contact_phone"]').required = delivery;
      document.querySelector('[name="latitude"]').required = delivery;
      document.querySelector('[name="longitude"]').required = delivery;
      document.querySelector('[name="booking_id"]').required = !delivery;
    }
  });
  app.addEventListener('submit', async event => {
    event.preventDefault();
    try {
      const form = event.target;
      const values = readForm(form);
      if (form.id === 'booking-form') {
        if (!values.table_id) throw new Error('Выберите столик на схеме зала');
        const result = await api('/api/bookings', {method:'POST', body:JSON.stringify({...values, table_id:Number(values.table_id)})});
        toast(result.message); await refreshBookings(); render();
      } else if (form.id === 'order-form') {
        const lines = Object.entries(state.cart).filter(([, quantity]) => quantity > 0).map(([menu_item_id, quantity]) => ({menu_item_id:Number(menu_item_id), quantity}));
        const result = await api('/api/orders', {method:'POST', body:JSON.stringify({delivery_type:values.delivery_type, address:values.address || null, contact_phone:values.contact_phone || null, latitude:values.latitude ? Number(values.latitude) : null, longitude:values.longitude ? Number(values.longitude) : null, booking_id:values.booking_id ? Number(values.booking_id) : null, items:lines})});
        state.cart = {}; state.deliveryDetails = { address: '', contact_phone: '', latitude: '', longitude: '' }; await loadData(); toast(`${t('Заказ №')}${result.id} ${t('принят на сумму')} ${money(result.total_price)}`); render();
      } else if (form.id === 'review-form') {
        await api('/api/reviews', {method:'POST', body:JSON.stringify({rating:Number(values.rating), text:values.text})});
        form.reset(); toast('Спасибо за отзыв!');
      } else if (form.id === 'menu-add-form') {
        await api('/api/admin/menu', {method:'POST', body:JSON.stringify({...values, price:Number(values.price)})});
        await loadData(); toast('Позиция добавлена'); render();
      }
    } catch (error) { toast(error.message, true); }
  });
  async function loadData() {
    [state.menu, state.tables, state.offers, state.orders] = await Promise.all([api('/api/menu'), api('/api/tables'), api('/api/offers'), api('/api/orders/mine')]);
    await refreshBookings();
  }
  async function boot() {
    try {
      try {
        const localeResponse = await fetch('/static/i18n.json', { cache: 'no-cache' });
        if (localeResponse.ok) state.translations = await localeResponse.json();
      } catch (_) {}
      try {
        const savedLanguage = localStorage.getItem('stories-language');
        const savedTheme = localStorage.getItem('stories-theme');
        if (savedLanguage === 'ru' || savedLanguage === 'kk') state.language = savedLanguage;
        if (savedTheme === 'light' || savedTheme === 'dark') state.theme = savedTheme;
      } catch (_) {}
      applyPreferences();
      if (!initData && !devMode) {
        app.innerHTML = `<div class="notice error">${esc(t('Откройте приложение через Telegram. Для локального теста добавьте'))} <code>?demo=1</code> (${esc(t('сервер должен быть запущен с DEV_MODE=true'))}).</div>`;
        return;
      }
      state.user = await api('/api/me');
      document.querySelector('#user-label').textContent = state.user.role === 'admin' ? 'Администратор' : state.user.name;
      await loadData(); render();
    } catch (error) { app.innerHTML = `<div class="notice error">${esc(error.message)}</div>`; }
  }
  boot();
})();
</script>
</body>
</html>
